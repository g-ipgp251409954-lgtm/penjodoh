<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuiz Penjodoh Bilangan – Tahun 6</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#d9d4c7;--acc:#2f6fed;--ok:#1f9d55;--okbg:#dff5e8;--bad:#d64545;--badbg:#fde4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--ink:#eef1f7;--mute:#9aa4b8;--line:#2e3648;--acc:#6b9bff;--ok:#4cd08a;--okbg:#17382a;--bad:#ff7b7b;--badbg:#3d1e22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1c2230;--ink:#eef1f7;--mute:#9aa4b8;--line:#2e3648;--acc:#6b9bff;--ok:#4cd08a;--okbg:#17382a;--bad:#ff7b7b;--badbg:#3d1e22;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec{font-weight:700;font-size:clamp(14px,1.8vw,22px)}
.prog{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,44px);width:100%;max-width:1100px;text-align:center}
.qn{color:var(--mute);font-size:clamp(14px,1.6vw,20px);margin-bottom:8px}
.q{font-size:clamp(24px,3.6vw,50px);line-height:1.4;font-weight:600;margin:0 0 24px}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--acc);margin:0 4px;padding:0 6px}
.blank b{color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;font-size:clamp(20px,2.8vw,38px);padding:16px 20px;border-width:2px;border-radius:14px}
.opt span{font-weight:800;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:.75}
.wrong{background:var(--badbg);color:var(--bad);border-radius:8px;padding:0 8px}
.wrong.fix{text-decoration:line-through}
.right{background:var(--okbg);color:var(--ok);border-radius:8px;padding:0 8px;font-weight:700}
.hint{color:var(--mute);font-size:clamp(16px,2vw,26px);margin-top:14px}
.ans{margin-top:18px;font-size:clamp(20px,2.6vw,36px);color:var(--ok);font-weight:700}
.big{font-size:clamp(30px,5vw,70px);font-weight:800;margin:0 0 12px}
.teamsel{display:flex;gap:10px;justify-content:center;margin:18px 0}
.teamsel button{font-size:24px;width:56px;height:56px}.teamsel .on{background:var(--acc);color:#fff;border-color:var(--acc)}
footer{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.team .nm{font-weight:700}.team .sc{font-size:clamp(20px,2.4vw,32px);font-weight:800;min-width:1.6em;text-align:center}
.team button{padding:2px 10px;font-size:20px;line-height:1.2}
.nav{display:flex;gap:8px}
.rank{display:grid;gap:10px;max-width:520px;margin:18px auto 0;text-align:left;font-size:clamp(20px,2.6vw,34px)}
.rank div{display:flex;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 18px}
</style>
</head>
<body>
<header>
  <div class="sec" id="sec">Kuiz Penjodoh Bilangan</div>
  <div class="prog"><i id="bar" style="width:0"></i></div>
  <button id="tm" title="Mula / set semula pemasa">⏱ 30</button>
  <button id="fs">⛶ Skrin penuh</button>
</header>
<main><div class="card" id="card"></div></main>
<footer>
  <div class="teams" id="teams"></div>
  <div class="nav">
    <button id="prev">← Sebelum</button>
    <button id="rev" class="pri">Tunjuk Jawapan</button>
    <button id="next">Seterusnya →</button>
  </div>
</footer>
<script>
var S={A:"Bahagian A – Pilih Jawapan yang Betul",B:"Bahagian B – Isi Tempat Kosong",C:"Bahagian C – Kenal Pasti Kesalahan",D:"Bahagian D – Bina Ayat"};
var Q=[
{s:"A",t:"Ibu membeli tiga ___ pisang di pasar untuk dibuat goreng pisang.",o:["biji","sisir","helai","batang"],a:1},
{s:"A",t:"Ayah menghadiahkan se___ jam tangan kepada abang sempena hari lahirnya.",o:["bentuk","buah","utas","bilah"],a:2},
{s:"A",t:"Kakak membeli dua ___ kasut sukan di kedai itu.",o:["pasang","buah","helai","batang"],a:0},
{s:"A",t:"Pak Abu menggunakan se___ pisau untuk memotong daging.",o:["batang","bilah","bentuk","utas"],a:1},
{s:"A",t:"Nelayan itu berjaya menangkap lima ___ ikan di laut.",o:["ekor","biji","buah","keping"],a:0},
{s:"A",t:"Puan Aminah membeli se___ kain batik untuk dijadikan baju kurung.",o:["bidang","butir","keping","batang"],a:0},
{s:"A",t:"Adik membawa se___ payung ketika keluar rumah kerana cuaca mendung.",o:["buah","batang","bilah","bentuk"],a:1},
{s:"A",t:"Datuk mengikat kayu api itu dengan se___ tali.",o:["utas","helai","keping","biji"],a:0},
{s:"A",t:"Pekerja itu mengangkat beberapa ___ batu bata untuk membina tembok.",o:["batang","ketul","buah","pucuk"],a:1},
{s:"A",t:"Kakak menerima se___ surat daripada sahabatnya yang tinggal di Sabah.",o:["naskhah","pucuk","helai","keping"],a:1},
{s:"B",t:"Ibu membeli dua ___ telur ayam di pasar raya.",a:"biji"},
{s:"B",t:"Pak cik menebang se___ pokok kelapa di belakang rumah.",a:"batang"},
{s:"B",t:"Adik membaca se___ buku cerita sebelum tidur.",a:"naskhah (atau buah)"},
{s:"B",t:"Ayah membeli tiga ___ bunga ros untuk ibu.",a:"kuntum"},
{s:"B",t:"Beberapa ___ burung sedang terbang di udara.",a:"ekor"},
{s:"B",t:"Kakak memakai se___ rantai emas yang dihadiahkan oleh ibu.",a:"utas"},
{s:"B",t:"Pekerja itu mengutip se___ sampah di kawasan taman.",a:"timbunan"},
{s:"B",t:"Abang meletakkan se___ kunci di atas meja.",a:"anak"},
{s:"C",t:"Ibu membeli [sehelai|sepasang] kasut baharu untuk adik."},
{s:"C",t:"Ayah membaca [sebiji|senaskhah] surat khabar pada waktu pagi."},
{s:"C",t:"Kakak memetik [sekuntum|sehelai] daun pandan di halaman rumah."},
{s:"C",t:"Pak Ali menangkap [seekor|sesisir] pisang di kebunnya."},
{s:"C",t:"Adik membawa [sebatang|sebuah] buku ke sekolah."},
{s:"D",w:"Segugus",a:"Ibu membeli segugus anggur di pasar."},
{s:"D",w:"Seutas",a:"Kakak memakai seutas gelang emas."},
{s:"D",w:"Sebilah",a:"Datuk mengasah sebilah parang."},
{s:"D",w:"Sekawan",a:"Sekawan gajah melintasi sungai."},
{s:"D",w:"Sehelai",a:"Adik melipat sehelai baju."}
];
var i=-1,rev=false,sel=-1,nt=4,T=[],L="ABCD";
var $=function(x){return document.getElementById(x)};
function blank(t,txt){return t.replace(/_+/,'<span class="blank">'+(txt?'<b>'+txt+'</b>':'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>')}
function draw(){
  var c=$("card"),q=Q[i],h="";
  $("bar").style.width=(Math.max(i,0)/Q.length*100)+"%";
  $("sec").textContent=i<0?"Kuiz Penjodoh Bilangan":i>=Q.length?"Tamat":S[q.s];
  $("rev").style.display=(i>=0&&i<Q.length)?"":"none";
  $("rev").textContent=rev?"Sembunyi Jawapan":"Tunjuk Jawapan";
  if(i<0){
    h='<p class="big">Kuiz Penjodoh Bilangan</p><div class="qn">Bahasa Melayu Tahun 6 · '+Q.length+' soalan</div><p class="q" style="font-size:clamp(20px,2.4vw,32px)">Pilih bilangan pasukan:</p><div class="teamsel">';
    for(var n=2;n<=6;n++)h+='<button class="'+(n==nt?'on':'')+'" onclick="nt='+n+';draw()">'+n+'</button>';
    h+='</div><button class="pri" style="font-size:26px;padding:14px 34px" onclick="start()">Mula ▶</button><div class="hint">Pintasan: Ruang = tunjuk jawapan · → / ← = soalan · A–D = pilih pilihan</div>';
  } else if(i>=Q.length){
    var r=T.slice().sort(function(a,b){return b.s-a.s});
    h='<p class="big">🏆 Tahniah!</p><div class="qn">Keputusan akhir</div><div class="rank">';
    r.forEach(function(t,k){h+='<div><span>'+(k+1)+'. '+t.n+'</span><b>'+t.s+' mata</b></div>'});
    h+='</div>';
  } else {
    h='<div class="qn">Soalan '+(Q.slice(0,i).filter(function(z){return z.s==q.s}).length+1)+' / '+Q.filter(function(z){return z.s==q.s}).length+'</div>';
    if(q.s=="A"){
      h+='<p class="q">'+blank(q.t,rev?q.o[q.a]:"")+'</p><div class="opts">';
      q.o.forEach(function(o,k){var cl="opt";if(rev)cl+=k==q.a?" ok":(k==sel?" bad":"");else if(k==sel)cl+=" sel";h+='<button class="'+cl+'" onclick="pick('+k+')"><span>'+L[k]+'.</span>'+o+'</button>'});
      h+='</div>';
    } else if(q.s=="B"){
      h+='<p class="q">'+blank(q.t,rev?q.a:"")+'</p><div class="hint">Isi tempat kosong dengan penjodoh bilangan yang sesuai</div>';
    } else if(q.s=="C"){
      var m=q.t.match(/\[(.+?)\|(.+?)\]/);
      var s=q.t.replace(m[0],'<span class="wrong'+(rev?' fix':'')+'">'+m[1]+'</span>'+(rev?' <span class="right">'+m[2]+'</span>':''));
      h+='<p class="q">'+s+'</p><div class="hint">'+(rev?'Betulkan penjodoh bilangan yang salah ✔':'Cari penjodoh bilangan yang salah')+'</div>';
    } else {
      h+='<p class="q">Bina satu ayat dengan:<br><span class="right" style="font-size:1.3em">'+q.w+'</span></p>'+(rev?'<div class="ans">Contoh: '+q.a+'</div>':'<div class="hint">Murid membina ayat · guru menilai</div>');
    }
  }
  c.innerHTML=h;
}
function start(){T=[];for(var k=0;k<nt;k++)T.push({n:"Pasukan "+(k+1),s:0});i=0;go(0)}
function go(d){i=Math.max(-1,Math.min(Q.length,i+d));rev=false;sel=-1;teams();resetT();draw()}
function pick(k){if(!rev){sel=(sel==k?-1:k);draw()}}
function toggle(){if(i>=0&&i<Q.length){rev=!rev;draw()}}
function teams(){
  var e=$("teams");e.innerHTML="";
  T.forEach(function(t,k){
    var d=document.createElement("div");d.className="team";d.style.borderColor="hsl("+(k*60+210)+",70%,55%)";
    d.innerHTML='<span class="nm">'+t.n+'</span><button>−</button><span class="sc">'+t.s+'</span><button>+</button>';
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){t.s--;teams()};b[1].onclick=function(){t.s++;teams()};
    e.appendChild(d);
  });
}
var tv,left=30;
function resetT(){clearInterval(tv);tv=null;left=30;$("tm").textContent="⏱ 30"}
$("tm").onclick=function(){
  if(tv){resetT();return}
  tv=setInterval(function(){left--;$("tm").textContent="⏱ "+left;if(left<=0){clearInterval(tv);tv=null;$("tm").textContent="⏰ Masa tamat!"}},1000);
};
$("prev").onclick=function(){go(-1)};$("next").onclick=function(){go(1)};$("rev").onclick=toggle;
$("fs").onclick=function(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle()}
  else if(i>=0&&i<Q.length&&Q[i].s=="A"){var k=L.indexOf(e.key.toUpperCase());if(k>=0&&e.key.length==1)pick(k)}
});
draw();
</script>
</body>
</html>
